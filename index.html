<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Juego 3 en Línea</title>
    <script src="js/script.js" defer></script>
</head>
<body class="bg-secondary">

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-8 col-md-6 col-lg-4">
                
                <h3 class="text-center mb-4">Juego 3 en Línea</h3>

                <!-- Jugador 1 X -->
                <div class="row g-2 mb-2 align-items-center">
                    <div class="col-3">
                        <div class="border rounded text-center p-2 bg-dark border-dark border-2">
                            <img src="img/X.png" alt="X" class="img-fluid" style="max-height: 35px;">
                        </div>
                    </div>
                    <div class="col-9">
                        <input type="text" id="jugador1"
                            class="form-control bg-secondary text-light border-dark border-2"
                            placeholder="Nombre Jugador 1">
                    </div>
                </div>

                <!-- Jugador 2 O -->
                <div class="row g-2 mb-3 align-items-center">
                    <div class="col-3">
                        <div class="border rounded text-center p-2 bg-dark border-dark border-2 ">
                            <img src="img/0.png" alt="O" class="img-fluid" style="max-height: 43px;">
                        </div>
                    </div>
                    <div class="col-9">
                        <input type="text" id="jugador2" 
                            class="form-control bg-secondary text-light border-dark border-2" 
                            placeholder="Nombre Jugador 2" value="">
                    </div>
                </div>

                <!-- Botón Iniciar -->
                <div class="d-grid mb-3">
                    <button type="button" id="btnIniciar" 
                    class="btn btn-dark rounded-pill">
                    Iniciar Juego
                    </button>
                </div>

                <!-- Indicador de Turno -->
                <h5 class="text-center mb-3" id="turnoTexto">Turno:</h5>

                <!-- Tablero 3x3 (preparado con filas y columnas para manejarlo como matriz en JS) -->
                <div class="container px-4">
                    <div class="row g-0">
                        <div class="col-4">
                        <button type="button" class="btn btn-outline-dark w-100 p-0 overflow-hidden ratio ratio-1x1" data-fila="0" data-col="0">
                            <img src="img/neutral.jpg" alt="Casilla vacía" class="w-100 h-100 object-fit-cover">
                        </button>
                        </div>
                        <div class="col-4">
                            <button type="button" class="btn btn-outline-dark w-100 p-0 overflow-hidden ratio ratio-1x1" data-fila="0" data-col="1">
                                <img src="img/neutral.jpg" alt="Casilla vacía" class="w-100 h-100 object-fit-cover">
                            </button>
                        </div>
                        <div class="col-4">
                            <button type="button" class="btn btn-outline-dark w-100 p-0 overflow-hidden ratio ratio-1x1" data-fila="0" data-col="2">
                                <img src="img/neutral.jpg" alt="Casilla vacía" class="w-100 h-100 object-fit-cover">
                            </button>
                        </div>
                    </div>

                    <div class="row g-0 ">
                        <div class="col-4">
                            <button type="button" class="btn btn-outline-dark w-100 p-0 overflow-hidden ratio ratio-1x1" style="height: 80px;" data-fila="1" data-col="0">
                                <img src="img/neutral.jpg" alt="Casilla vacía" class="w-100 h-100 object-fit-cover">
                            </button>
                        </div>
                        <div class="col-4">
                            <button type="button" class="btn btn-outline-dark w-100 p-0 overflow-hidden ratio ratio-1x1" style="height: 80px;" data-fila="1" data-col="1">
                                <img src="img/neutral.jpg" alt="Casilla vacía" class="w-100 h-100 object-fit-cover">
                                </button>
                        </div>
                        <div class="col-4">
                            <button type="button" class="btn btn-outline-dark w-100 p-0 overflow-hidden ratio ratio-1x1" style="height: 80px;" data-fila="1" data-col="2">
                                <img src="img/neutral.jpg" alt="Casilla vacía" class="w-100 h-100 object-fit-cover">
                            </button>
                        </div>
                    </div>

                    <div class="row g-0">
                        <div class="col-4">
                            <button type="button" class="btn btn-outline-dark w-100 p-0 overflow-hidden ratio ratio-1x1" style="height: 80px;" data-fila="2" data-col="0">
                                <img src="img/neutral.jpg" alt="Casilla vacía" class="w-100 h-100 object-fit-cover">
                            </button>
                        </div>
                        <div class="col-4">
                            <button type="button" class="btn btn-outline-dark w-100 p-0 overflow-hidden ratio ratio-1x1" style="height: 80px;" data-fila="2" data-col="1">
                                <img src="img/neutral.jpg" alt="Casilla vacía" class="w-100 h-100 object-fit-cover">
                            </button>
                        </div>
                        <div class="col-4">
                            <button type="button" class="btn btn-outline-dark w-100 p-0 overflow-hidden ratio ratio-1x1" style="height: 80px;" data-fila="2" data-col="2">
                                <img src="img/neutral.jpg" alt="Casilla vacía" class="w-100 h-100 object-fit-cover">
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
